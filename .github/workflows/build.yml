name: Build AzmoOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Construire aussi l'image Raspberry Pi (.img.xz)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make test
      - run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: azmod-binaries
          path: dist/*
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/azmod-linux-arm64
            dist/azmod-linux-armv6
            dist/azmod-linux-amd64
            scripts/install.sh
          generate_release_notes: true

  image:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v') || inputs.image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azmod-binaries
          path: dist
      - name: Préparer le stage AzmoOS
        run: |
          cp dist/azmod-linux-arm64 image/stage-azmo/01-azmoos/files/azmod
          cp scripts/azmoos.service image/stage-azmo/01-azmoos/files/azmoos.service
          chmod +x image/stage-azmo/*.sh image/stage-azmo/*/*.sh
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: AzmoOS
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./image/stage-azmo
          hostname: azmoos
          username: azmo
          password: azmoos
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          locale: fr_FR.UTF-8
          keyboard-keymap: fr
          keyboard-layout: French
          timezone: Europe/Paris
          compression: xz
          export-last-stage-only: true
      - uses: actions/upload-artifact@v4
        with:
          name: AzmoOS-image
          path: ${{ steps.build.outputs.image-path }}
      - name: Ajouter l'image à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
