name: Azmo OS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Construire aussi l'image Raspberry Pi (.img.xz)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Tests et binaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface web
        run: make web
      - name: Tests
        run: make test
      - name: Binaires et archives
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: azmoos
          path: |
            dist/*
            web/dist
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/azmod-linux-arm64
            dist/azmod-linux-armv6
            dist/azmod-linux-amd64
            dist/azmoos-web.tar.gz
            dist/SHA256SUMS
            scripts/install.sh
          generate_release_notes: true

  image:
    name: Image Raspberry Pi
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azmoos
          path: .
      - name: Préparer le stage Azmo OS
        run: ./image/prepare-stage.sh
      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: AzmoOS
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./image/stage-azmo
          hostname: azmoos
          username: azmo
          password: azmoos
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          locale: fr_FR.UTF-8
          keyboard-keymap: fr
          keyboard-layout: French
          timezone: Europe/Paris
          compression: xz
          export-last-stage-only: true
      - uses: actions/upload-artifact@v4
        with:
          name: AzmoOS-image
          path: ${{ steps.build.outputs.image-path }}
      - name: Ajouter l'image à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
